---
layout: default
title: AI Chat - MIA
---

<ion-app>
  <ion-split-pane content-id="main-content" when="md">

 {% include menu.html %}

    <!-- KONTEN UTAMA CHAT -->
    <div class="ion-page" id="main-content">

 {% include header.html %}

      <ion-content id="chat-content" scroll-events="true">
        <div class="chat-container" id="messages-container">
          <div class="empty-chat" style="display: none;" id="empty-chat-placeholder">
            <ion-icon name="sparkles-outline" style="font-size: 54px; color: #cbd5e1; margin-bottom: 12px;"></ion-icon>
            <p class="text-slate-500">Mulai sesi baru bersama AI MIA.<br>Ketik pertanyaan teknis atau umum di bawah!</p>
          </div>
        </div>
      </ion-content>

 {% includes footer.html %}

      <ion-fab id="scroll-top-fab" class="scroll-top-fab" vertical="bottom" horizontal="end" slot="fixed" style="display: none;">
        <ion-fab-button size="small" color="light" id="scroll-top-btn">
          <ion-icon name="arrow-up-outline"></ion-icon>
        </ion-fab-button>
      </ion-fab>
    </div>
  </ion-split-pane>
</ion-app>
