<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Chat</title>

  <!-- Ionic Core 8 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />

  <!-- Google Fonts: Inter & JetBrains Mono untuk Kode -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown Parser & XSS Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  
</head>
<body>
  <ion-app>
    <ion-split-pane content-id="main-content" when="md">

      <!-- SIDEBAR: Riwayat Chat -->
      <ion-menu side="start" menu-id="chatHistoryMenu" content-id="main-content" swipeGesture="true">
        <ion-header>
          <ion-toolbar>
            <ion-title style="font-weight: 600;">Riwayat Chat</ion-title>
            <ion-buttons slot="end">
              <ion-button id="new-chat-btn">
                <ion-icon slot="icon-only" name="chatboxes" color="primary"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-list id="conversation-list" lines="full">
            <ion-item lines="none" class="ion-text-center" style="--min-height: 80px;">
              <ion-label class="ion-text-center" color="medium">Memuat riwayat...</ion-label>
            </ion-item>
          </ion-list>
        </ion-content>
      </ion-menu>

      <!-- CONTENT UTAMA CHAT -->
      <div class="ion-page" id="main-content">
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-menu-button menu="chatHistoryMenu"></ion-menu-button>
            </ion-buttons>
            <ion-title id="chat-title" style="font-weight: 600;">Percakapan AI</ion-title>
            <ion-buttons slot="end">
              <ion-button id="clear-current-chat-btn" fill="clear">
                <ion-icon slot="icon-only" name="trash-outline" color="danger"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>

        <ion-content id="chat-content" scroll-events="true">
          <div class="chat-container" id="messages-container">
            <!-- Pesan akan dirender disini -->
            <div class="empty-chat" style="display: none;" id="empty-chat-placeholder">
              <ion-icon name="sparkles-outline" style="font-size: 54px; color: #cbd5e1; margin-bottom: 12px;"></ion-icon>
              <p class="text-slate-500">Mulai sesi baru bersama AI MIA.<br>Ketik pertanyaan teknis atau umum di bawah!</p>
            </div>
          </div>
        </ion-content>

        <ion-footer>
          <ion-toolbar>
            <div class="input-container">
              <ion-input id="message-input" placeholder="Tanyakan sesuatu..." value="" autocomplete="off"></ion-input>
            <ion-buttons>
              <ion-button id="send-message-btn" class="send-btn" fill="clear" color="primary">
                <ion-icon name="send-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-buttons>
            </div>
          </ion-toolbar>
        </ion-footer>

        <!-- Scroll to top FAB -->
        <ion-fab id="scroll-top-fab" class="scroll-top-fab" vertical="bottom" horizontal="end" slot="fixed" style="display: none;">
          <ion-fab-button size="small" color="light" id="scroll-top-btn">
            <ion-icon name="arrow-up-outline"></ion-icon>
          </ion-fab-button>
        </ion-fab>
      </div>
    </ion-split-pane>
  </ion-app>

  <!-- IONIC CORE & IONICONS CDN -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.js"></script>
  <script type="javascript" src="./assets/js/app.js"></script>
  
</body>
</html>
