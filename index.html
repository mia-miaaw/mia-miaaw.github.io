---
layout: default
title: AI Chat - MIA
---

<ion-app>
  <ion-split-pane content-id="main-content" when="md">

    <!-- SIDEBAR RIWAYAT -->
    <ion-menu side="start" menu-id="chatHistoryMenu" content-id="main-content" swipeGesture="true">
      <ion-header>
        <ion-toolbar>
          <ion-title style="font-weight: 600;">Riwayat Chat</ion-title>
          <ion-buttons slot="end">
            <ion-button id="new-chat-btn">
              <ion-icon slot="icon-only" name="chatbubble-ellipses-outline" color="primary"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list id="conversation-list" lines="full">
          <ion-item lines="none" class="ion-text-center" style="--min-height: 80px;">
            <ion-label class="ion-text-center" color="medium">Memuat riwayat...</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- KONTEN UTAMA CHAT -->
    <div class="ion-page" id="main-content">
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-menu-button menu="chatHistoryMenu"></ion-menu-button>
          </ion-buttons>
          <ion-title id="chat-title" style="font-weight: 600;">Percakapan AI</ion-title>
          <ion-buttons slot="end">
            <ion-button id="clear-current-chat-btn" fill="clear">
              <ion-icon slot="icon-only" name="trash" color="danger"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content id="chat-content" scroll-events="true">
        <div class="chat-container" id="messages-container">
          <div class="empty-chat" style="display: none;" id="empty-chat-placeholder">
            <ion-icon name="sparkles-outline" style="font-size: 54px; color: #cbd5e1; margin-bottom: 12px;"></ion-icon>
            <p class="text-slate-500">Mulai sesi baru bersama AI MIA.<br>Ketik pertanyaan teknis atau umum di bawah!</p>
          </div>
        </div>
      </ion-content>

      <!-- FOOTER INPUT & LAMPIRAN -->
      <ion-footer>
        <ion-toolbar>
          <div class="footer-wrapper">
            <div id="attachment-preview-container" class="attachment-preview-container"></div>
            <div class="input-container-modern">
              <button id="attach-file-btn" class="attach-btn" type="button">
                <ion-icon name="add-circle-outline"></ion-icon>
              </button>
              <input type="file" id="hidden-file-input" class="hidden-input" multiple>
              <textarea id="message-input" class="modern-textarea" placeholder="Tanyakan sesuatu... (Shift+Enter untuk baris baru)" rows="1" autocomplete="off"></textarea>
              <button id="send-message-btn" class="send-btn-modern" type="button">
                <ion-icon name="arrow-up-circle"></ion-icon>
              </button>
            </div>
          </div>
        </ion-toolbar>
      </ion-footer>

      <ion-fab id="scroll-top-fab" class="scroll-top-fab" vertical="bottom" horizontal="end" slot="fixed" style="display: none;">
        <ion-fab-button size="small" color="light" id="scroll-top-btn">
          <ion-icon name="arrow-up-outline"></ion-icon>
        </ion-fab-button>
      </ion-fab>
    </div>
  </ion-split-pane>
</ion-app>
