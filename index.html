<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Chat - Gemini Style Fixed</title>
  
  <!-- Ionic Core 8 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core@8/css/ionic.bundle.css" />
  
  <!-- Google Fonts: Inter & JetBrains Mono untuk Kode -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown Parser & XSS Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  
  <style>
    /* Desain Sistem Global & Variabel Warna */
    :root {
      --chat-user-bg: #f3f4f6; /* Abu-abu netral tipis untuk User */
      --chat-ai-bg: transparent; /* Flat tanpa background untuk AI, mirip Gemini */
      --chat-user-color: #1f2937;
      --chat-ai-color: #1f2937;
      --sidebar-width: 290px;
    }

    body, ion-app, ion-item, ion-label, ion-title, ion-button {
      font-family: 'Inter', sans-serif;
    }

    /* Container utama obrolan bergaya datar */
    .chat-container {
      display: flex;
      flex-direction: column;
      padding: 24px 16px 40px 16px;
      gap: 28px; /* Jarak renggang antar percakapan bergaya Copilot/Gemini */
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }

    /* Message Item - Perbaikan Struktur Flexbox */
    .message {
      display: flex;
      width: 100%;
      gap: 12px;
      box-sizing: border-box;
      animation: fadeIn 0.25s ease-out;
    }

    /* Alinyemen Khusus Berdasarkan Pengirim */
    .message.user {
      justify-content: flex-end; /* Dorong semua konten ke kanan */
    }

    .message.ai {
      justify-content: flex-start; /* Dorong semua konten ke kiri */
    }

    /* Avatar Bulat */
    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 15%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.75rem;
      flex-shrink: 0;
      user-select: none;
    }

    /* Aturan Urutan Flex (Order) agar Struktur HTML Tetap Konsisten */
    .message.user .message-avatar {
      background: #4f46e5;
      color: #ffffff;
      order: 2; /* Avatar ditaruh paling kanan */
    }

    .message.ai .message-avatar {
      background: #10b981;
      color: #ffffff;
      order: 1; /* Avatar ditaruh paling kiri */
    }

    /* Wadah Utama Konten Pesan */
    .message-body-container {
      max-width: calc(100% - 44px); /* Sisakan ruang untuk avatar agar tidak overlap */
      display: flex;
      flex-direction: column;
    }

    .message.user .message-body-container {
      align-items: flex-end; /* Teks user merapat ke kanan */
      order: 1; /* Konten ditaruh di sebelah kiri avatar */
    }

    .message.ai .message-body-container {
      align-items: flex-start; /* Teks AI merapat ke kiri */
      order: 2; /* Konten ditaruh di sebelah kanan avatar */
      width: 100%;
    }

    /* Gelembung Pesan Flat */
    .message-body {
      font-size: 0.95rem;
      line-height: 1.55;
      overflow-wrap: break-word;
      word-break: break-word;
      box-sizing: border-box;
    }

    /* Gelembung Spesifik User */
    .message.user .message-body {
      background: var(--chat-user-bg);
      color: var(--chat-user-color);
      padding: 10px 16px;
      border-radius: 18px;
    }

    /* Gelembung Spesifik AI (Gemini Style - Borderless / No Background) */
    .message.ai .message-body {
      background: var(--chat-ai-bg);
      color: var(--chat-ai-color);
      padding: 4px 0;
      width: 100%;
    }

    /* Styling Konten Markdown */
    .markdown-content p {
      margin: 0 0 12px 0;
    }
    .markdown-content p:last-child {
      margin-bottom: 0;
    }
    .markdown-content ul, .markdown-content ol {
      margin: 0 0 12px 20px;
      padding: 0;
    }
    .markdown-content li {
      margin-bottom: 4px;
    }
    .markdown-content h1, .markdown-content h2, .markdown-content h3, 
    .markdown-content h4, .markdown-content h5, .markdown-content h6 {
      color: #111827;
      font-weight: 600;
      margin: 20px 0 10px 0;
    }
    .markdown-content h1 { font-size: 1.35rem; }
    .markdown-content h2 { font-size: 1.2rem; }
    .markdown-content h3 { font-size: 1.05rem; }

    /* Blok Kode Modern & Tombol Salin */
    .code-block-wrapper {
      position: relative;
      background: #1e1e2e;
      border-radius: 8px;
      margin: 14px 0;
      border: 1px solid #313244;
      overflow: hidden;
      width: 100%;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181825;
      padding: 6px 14px;
      font-size: 0.7rem;
      color: #cdd6f4;
      border-bottom: 1px solid #313244;
      font-family: 'JetBrains Mono', monospace;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: #a6adc8;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      padding: 4px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: #313244;
      color: #f5c2e7;
    }

    .code-block-wrapper pre {
      margin: 0;
      padding: 12px 14px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      color: #cdd6f4;
    }

    /* Tabel di dalam Markdown */
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 0.85rem;
    }
    .markdown-content th, .markdown-content td {
      border: 1px solid #e5e7eb;
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-content th {
      background: #f9fafb;
      font-weight: 600;
    }

    /* Typing indicator flat style */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 0 12px 44px; /* Samakan posisi horizontal dengan text body AI */
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom scroll to top fab */
    .scroll-top-fab {
      bottom: 80px;
      right: 16px;
    }

    /* Styling Sidebar & Conversation List */
    .conversation-item {
      --padding-start: 16px;
      --padding-end: 8px;
      --inner-padding-end: 0px;
      cursor: pointer;
    }
    .conversation-item.active {
      --background: #f3f4f6;
      font-weight: 500;
    }
    .delete-conv-btn {
      margin: 0;
      height: 32px;
    }
    
    .empty-chat {
      text-align: center;
      color: #9ca3af;
      margin-top: 80px;
      font-size: 0.95rem;
    }

    ion-footer {
      background: white;
      border-top: 1px solid #f3f4f6;
    }
    .input-container {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    ion-input {
      --padding-start: 16px;
      --padding-end: 16px;
      --background: #f3f4f6;
      border-radius: 24px;
      --border-radius: 24px;
      --box-shadow: none;
      --highlight-color-focused: transparent;
      flex: 1;
      font-size: 0.95rem;
    }
    .send-btn {
      margin: 0;
      --border-radius: 50%;
      height: 40px;
      width: 40px;
    }
    ion-split-pane {
      --side-width: var(--sidebar-width);
      --side-max-width: 320px;
    }
    ion-menu {
      --width: var(--sidebar-width);
    }
  </style>
</head>
<body>
  <ion-app>
    <ion-split-pane content-id="main-content" when="md">
      
      <!-- SIDEBAR: Riwayat Chat -->
      <ion-menu side="start" menu-id="chatHistoryMenu" content-id="main-content" swipeGesture="true">
        <ion-header>
          <ion-toolbar>
            <ion-title style="font-weight: 600;">Riwayat Chat</ion-title>
            <ion-buttons slot="end">
              <ion-button id="new-chat-btn">
                <ion-icon slot="icon-only" name="add-outline"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
        <ion-content>
          <ion-list id="conversation-list" lines="full">
            <ion-item lines="none" class="ion-text-center" style="--min-height: 80px;">
              <ion-label class="ion-text-center" color="medium">Memuat riwayat...</ion-label>
            </ion-item>
          </ion-list>
        </ion-content>
      </ion-menu>

      <!-- CONTENT UTAMA CHAT -->
      <div class="ion-page" id="main-content">
        <ion-header>
          <ion-toolbar>
            <ion-buttons slot="start">
              <ion-menu-button menu="chatHistoryMenu"></ion-menu-button>
            </ion-buttons>
            <ion-title id="chat-title" style="font-weight: 600;">Percakapan AI</ion-title>
            <ion-buttons slot="end">
              <ion-button id="clear-current-chat-btn" fill="clear">
                <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>

        <ion-content id="chat-content" scroll-events="true">
          <div class="chat-container" id="messages-container">
            <!-- Pesan akan dirender disini -->
            <div class="empty-chat" style="display: none;" id="empty-chat-placeholder">
              <ion-icon name="sparkles-outline" style="font-size: 54px; color: #cbd5e1; margin-bottom: 12px;"></ion-icon>
              <p class="text-slate-500">Mulai sesi baru bersama AI Gemini Style.<br>Ketikkan pertanyaan teknis atau umum di bawah!</p>
            </div>
          </div>
        </ion-content>

        <ion-footer>
          <ion-toolbar>
            <div class="input-container">
              <ion-input id="message-input" placeholder="Tanyakan sesuatu..." value="" autocomplete="off"></ion-input>
            <ion-buttons>
              <ion-button id="send-message-btn" class="send-btn" fill="clear" color="primary">
                <ion-icon name="send-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-buttons>
            </div>
          </ion-toolbar>
        </ion-footer>

        <!-- Scroll to top FAB -->
        <ion-fab id="scroll-top-fab" class="scroll-top-fab" vertical="bottom" horizontal="end" slot="fixed" style="display: none;">
          <ion-fab-button size="small" color="light" id="scroll-top-btn">
            <ion-icon name="arrow-up-outline"></ion-icon>
          </ion-fab-button>
        </ion-fab>
      </div>
    </ion-split-pane>
  </ion-app>

  <!-- IONIC CORE & IONICONS CDN -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core@8/dist/ionic/ionic.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.js"></script>

  <script>
    (function(){
      // ---------- GLOBAL CONFIG ----------
      const API_BASE_URL = 'https://ai-coding-worker.androidbutut.workers.dev';

      // ---------- GLOBAL STATE ----------
      let conversations = [];        // array of { id, title, messages: [{id, text, sender, timestamp}] }
      let currentConversationId = null;
      let isWaitingResponse = false; // mencegah double-submission
      let currentTypingIndicatorElement = null;

      // DOM references
      let messagesContainer;
      let emptyPlaceholder;
      let conversationListEl;
      let chatContentEl;
      let messageInput;
      let sendBtn;
      let scrollTopFab;
      let chatTitleEl;

      // Custom Markdown renderer dengan bungkus Copy-Code modern
      const renderer = new marked.Renderer();
      renderer.code = function({ text, lang }) {
        const language = lang || 'code';
        const escapedCode = text.replace(/"/g, '&quot;');
        return `
          <div class="code-block-wrapper">
            <div class="code-header">
              <span>${language.toUpperCase()}</span>
              <button class="copy-btn" onclick="window.copyToClipboard(this, \`${escapedCode}\`)">
                <ion-icon name="copy-outline"></ion-icon>
                <span>Salin</span>
              </button>
            </div>
            <pre><code class="language-${language}">${escapeHtml(text)}</code></pre>
          </div>
        `;
      };
      
      marked.setOptions({ renderer });

      // Helper clipboard global untuk integrasi tombol copy code
      window.copyToClipboard = function(button, codeText) {
        const unescaped = codeText.replace(/&quot;/g, '"');
        const textarea = document.createElement('textarea');
        textarea.value = unescaped;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          const span = button.querySelector('span');
          const icon = button.querySelector('ion-icon');
          
          span.innerText = 'Tersalin!';
          button.style.color = '#10b981';
          icon.setAttribute('name', 'checkmark-outline');

          setTimeout(() => {
            span.innerText = 'Salin';
            button.style.color = '';
            icon.setAttribute('name', 'copy-outline');
          }, 2000);
        } catch (err) {
          console.error('Gagal menyalin:', err);
        } finally {
          document.body.removeChild(textarea);
        }
      };

      function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substr(2, 6);
      }

      // ---------- ION ALERT KOSTUM (Promise-based) ----------
      async function confirmDialog(header, message) {
        return new Promise((resolve) => {
          const alert = document.createElement('ion-alert');
          alert.header = header;
          alert.message = message;
          alert.buttons = [
            { text: 'Batal', role: 'cancel', handler: () => resolve(false) },
            { text: 'Ya, Hapus', role: 'confirm', handler: () => resolve(true) }
          ];
          document.body.appendChild(alert);
          alert.present().then(() => {
            alert.onDidDismiss().then((event) => {
              resolve(event.role === 'confirm');
              alert.remove();
            });
          });
        });
      }

      async function showAlert(header, message) {
        const alert = document.createElement('ion-alert');
        alert.header = header;
        alert.message = message;
        alert.buttons = ['OK'];
        document.body.appendChild(alert);
        await alert.present();
        alert.onDidDismiss().then(() => alert.remove());
      }

      // ---------- STORAGE MANAGEMENT ----------
      function saveToLocalStorage() {
        localStorage.setItem('ai_chat_app_data', JSON.stringify({
          conversations,
          currentConversationId
        }));
      }

      function loadFromLocalStorage() {
        const raw = localStorage.getItem('ai_chat_app_data');
        if (!raw) {
          const defaultId = generateId();
          conversations = [{ id: defaultId, title: 'Obrolan Baru', messages: [] }];
          currentConversationId = defaultId;
          saveToLocalStorage();
          return;
        }
        try {
          const data = JSON.parse(raw);
          conversations = data.conversations || [];
          currentConversationId = data.currentConversationId || (conversations[0]?.id || null);
          if (!conversations.length) {
            const newId = generateId();
            conversations = [{ id: newId, title: 'Obrolan Baru', messages: [] }];
            currentConversationId = newId;
            saveToLocalStorage();
          }
        } catch(e) {
          console.warn(e);
          const defaultId = generateId();
          conversations = [{ id: defaultId, title: 'Obrolan Baru', messages: [] }];
          currentConversationId = defaultId;
        }
      }

      function updateConversationTitle(convId) {
        const conv = conversations.find(c => c.id === convId);
        if (!conv) return;
        const firstUserMsg = conv.messages.find(m => m.sender === 'user');
        if (firstUserMsg && firstUserMsg.text) {
          let newTitle = firstUserMsg.text.length > 30 ? firstUserMsg.text.substring(0, 27) + '...' : firstUserMsg.text;
          conv.title = newTitle;
        } else {
          conv.title = 'Obrolan Baru';
        }
        saveToLocalStorage();
        renderSidebar();
        if (currentConversationId === convId) {
          chatTitleEl.innerText = conv.title;
        }
      }

      // ---------- RENDER SIDEBAR ----------
      function renderSidebar() {
        if (!conversationListEl) return;
        if (conversations.length === 0) {
          conversationListEl.innerHTML = `<ion-item lines="none" class="ion-text-center"><ion-label color="medium">Tidak ada percakapan</ion-label></ion-item>`;
          return;
        }
        let html = '';
        conversations.forEach(conv => {
          const isActive = (currentConversationId === conv.id);
          const activeClass = isActive ? 'active' : '';
          html += `
            <ion-item class="conversation-item ${activeClass}" data-conv-id="${conv.id}" button detail="false">
              <ion-label class="ion-text-wrap">
                <h3 style="margin: 0; font-size: 0.95rem; font-weight: ${isActive ? '600' : '400'}">${escapeHtml(conv.title)}</h3>
                <p style="font-size: 0.75rem; color: #9ca3af; margin-top: 4px;">${conv.messages.length} pesan</p>
              </ion-label>
              <ion-buttons slot="end">
                <ion-button class="delete-conv-btn" fill="clear" color="danger" data-conv-delete="${conv.id}">
                  <ion-icon slot="icon-only" name="trash-outline" style="font-size: 1.1rem;"></ion-icon>
                </ion-button>
              </ion-buttons>
            </ion-item>
          `;
        });
        conversationListEl.innerHTML = html;
        
        // Pasang Event Listeners
        document.querySelectorAll('.conversation-item').forEach(item => {
          const convId = item.getAttribute('data-conv-id');
          item.addEventListener('click', (e) => {
            if (e.target.closest('.delete-conv-btn')) return;
            if (convId !== currentConversationId) {
              switchConversation(convId);
            }
          });
        });
        
        document.querySelectorAll('.delete-conv-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const convId = e.currentTarget.getAttribute('data-conv-delete');
            if (convId) deleteConversation(convId);
          });
        });
      }
      
      async function deleteConversation(convId) {
        const convToDelete = conversations.find(c => c.id === convId);
        if (!convToDelete) return;
        const confirmed = await confirmDialog('Hapus Percakapan', `Hapus "${convToDelete.title}" dari riwayat Anda?`);
        if (!confirmed) return;
        
        const index = conversations.findIndex(c => c.id === convId);
        if (index !== -1) conversations.splice(index, 1);
        
        if (conversations.length === 0) {
          const newId = generateId();
          conversations.push({ id: newId, title: 'Obrolan Baru', messages: [] });
          currentConversationId = newId;
        } else if (currentConversationId === convId) {
          currentConversationId = conversations[0].id;
        }
        saveToLocalStorage();
        renderSidebar();
        renderCurrentChat();
        const currentConv = conversations.find(c => c.id === currentConversationId);
        chatTitleEl.innerText = currentConv ? currentConv.title : 'AI Chat';
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }

      // ---------- RENDER CHAT FLAT (GEMINI STYLE FIXED FLEXBOX) ----------
      function renderCurrentChat() {
        if (!messagesContainer) return;
        const currentConv = conversations.find(c => c.id === currentConversationId);
        if (!currentConv) return;
        
        messagesContainer.innerHTML = '';
        const messages = currentConv.messages;
        if (messages.length === 0) {
          emptyPlaceholder.style.display = 'flex';
        } else {
          emptyPlaceholder.style.display = 'none';
          messages.forEach(msg => {
            appendMessageToDom(msg.sender, msg.text, false);
          });
        }
        
        if (isWaitingResponse) {
          showTypingIndicatorOnly();
        } else {
          removeTypingIndicator();
        }
        scrollToBottom();
      }

      function appendMessageToDom(sender, text, isStreamChunk = false) {
        let messageDiv;
        
        if (isStreamChunk) {
          messageDiv = document.getElementById('streaming-message-node');
        }

        if (!messageDiv) {
          messageDiv = document.createElement('div');
          messageDiv.className = `message ${sender}`;
          if (isStreamChunk) {
            messageDiv.id = 'streaming-message-node';
          }

          // 1. Avatar Bulat Singkat
          const avatar = document.createElement('div');
          avatar.className = 'message-avatar';
          avatar.innerText = sender === 'user' ? 'U' : 'AI';
          messageDiv.appendChild(avatar);

          // 2. Kontainer Badan Utama (untuk penanganan flexbox alignment)
          const bodyContainer = document.createElement('div');
          bodyContainer.className = 'message-body-container';
          
          const body = document.createElement('div');
          body.className = 'message-body';
          
          if (sender === 'user') {
            body.innerText = text; // User tidak perlu render HTML/Markdown
          } else {
            // Render Markdown & Sanitasi Aman untuk AI
            body.classList.add('markdown-content');
            const rawHtml = marked.parse(text);
            body.innerHTML = DOMPurify.sanitize(rawHtml);
          }
          
          bodyContainer.appendChild(body);
          messageDiv.appendChild(bodyContainer);
          
          // Selalu pastikan ditaruh sebelum typing indicator jika ada
          const indicator = document.getElementById('live-typing-indicator');
          if (indicator) {
            messagesContainer.insertBefore(messageDiv, indicator);
          } else {
            messagesContainer.appendChild(messageDiv);
          }
        } else {
          // Melanjutkan data stream chunk yang masuk ke dalam kontainer
          const body = messageDiv.querySelector('.message-body');
          if (body) {
            const rawHtml = marked.parse(text);
            body.innerHTML = DOMPurify.sanitize(rawHtml);
          }
        }
      }
      
      function showTypingIndicatorOnly() {
        removeTypingIndicator();
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.id = 'live-typing-indicator';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('div');
          dot.className = 'typing-dot';
          typingDiv.appendChild(dot);
        }
        messagesContainer.appendChild(typingDiv);
        scrollToBottom();
        currentTypingIndicatorElement = typingDiv;
      }
      
      function removeTypingIndicator() {
        if (currentTypingIndicatorElement && currentTypingIndicatorElement.parentNode) {
          currentTypingIndicatorElement.remove();
          currentTypingIndicatorElement = null;
        }
        const existing = document.getElementById('live-typing-indicator');
        if (existing) existing.remove();
      }

      function addMessageToState(sender, text) {
        const conv = conversations.find(c => c.id === currentConversationId);
        if (!conv) return false;
        
        conv.messages.push({
          id: generateId(),
          text: text,
          sender: sender,
          timestamp: Date.now()
        });

        if (sender === 'user' && conv.messages.filter(m => m.sender === 'user').length === 1) {
          updateConversationTitle(currentConversationId);
        }
        saveToLocalStorage();
        return true;
      }

      // ---------- INTEGRASI STREAMING SSE REAL-TIME ----------
      async function executeAIStream(userMessage) {
        if (isWaitingResponse) return;
        isWaitingResponse = true;

        emptyPlaceholder.style.display = 'none';
        showTypingIndicatorOnly();

        const conv = conversations.find(c => c.id === currentConversationId);
        if (!conv) return;

        // Ambil riwayat chat lengkap untuk dikirim ke Worker
        const formattedMessages = conv.messages.map(m => ({
          role: m.sender === 'user' ? 'user' : 'assistant',
          content: m.text
        }));

        let responseTextAccumulator = '';

        try {
          const response = await fetch(`${API_BASE_URL}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Origin': window.location.origin || 'http://localhost:3000'
            },
            body: JSON.stringify({
              sessionId: currentConversationId,
              messages: formattedMessages
            })
          });

          removeTypingIndicator();

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || `HTTP error! status: ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          // Loop pembacaan byte stream
          while (true) {
            const { done, value } = await reader.read();
            if (done) {
              if (buffer.trim()) {
                responseTextAccumulator += parseSSELine(buffer);
                appendMessageToDom('ai', responseTextAccumulator, true);
              }
              break;
            }

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              const textContent = parseSSELine(line);
              if (textContent) {
                responseTextAccumulator += textContent;
                // Update DOM real-time ke user
                appendMessageToDom('ai', responseTextAccumulator, true);
                scrollToBottom();
              }
            }
          }

          // Bersihkan penanda streaming node di DOM
          const streamingNode = document.getElementById('streaming-message-node');
          if (streamingNode) {
            streamingNode.removeAttribute('id');
          }

          // Masukkan jawaban lengkap final ke array State obrolan
          if (responseTextAccumulator.trim()) {
            addMessageToState('ai', responseTextAccumulator.trim());
          }

        } catch (error) {
          console.error(error);
          removeTypingIndicator();
          
          const streamingNode = document.getElementById('streaming-message-node');
          if (streamingNode) streamingNode.remove();

          await showAlert('Gagal Terhubung', error.message || 'Terjadi gangguan saat memproses balasan AI.');
        } finally {
          isWaitingResponse = false;
          messageInput.value = '';
          renderCurrentChat();
        }
      }

      function parseSSELine(line) {
        if (!line.startsWith('data: ')) return '';
        const data = line.slice(6).trim();
        if (data === '[DONE]') return '';
        try {
          const parsed = JSON.parse(data);
          return parsed.choices?.[0]?.delta?.content || parsed.response || '';
        } catch {
          return '';
        }
      }
      
      async function sendUserMessage() {
        if (isWaitingResponse) {
          await showAlert('Tunggu', 'Harap tunggu respons AI saat ini selesai terlebih dahulu.');
          return;
        }
        const rawText = messageInput.value?.trim();
        if (!rawText) {
          await showAlert('Pesan kosong', 'Tolong ketikkan isi pesan Anda.');
          return;
        }
        
        addMessageToState('user', rawText);
        messageInput.value = '';
        renderCurrentChat();
        
        await executeAIStream(rawText);
      }
      
      function createNewChat() {
        if (isWaitingResponse) {
          showAlert('Tunggu', 'Selesaikan proses streaming sebelum membuat percakapan baru.');
          return;
        }
        const newId = generateId();
        const newConv = { id: newId, title: 'Obrolan Baru', messages: [] };
        conversations.unshift(newConv);
        currentConversationId = newId;
        saveToLocalStorage();
        renderSidebar();
        renderCurrentChat();
        chatTitleEl.innerText = 'Obrolan Baru';
        scrollToBottom();
      }
      
      function switchConversation(convId) {
        if (isWaitingResponse) {
          showAlert('Tunggu', 'Selesaikan proses streaming sebelum berpindah riwayat.');
          return;
        }
        const conv = conversations.find(c => c.id === convId);
        if (!conv) return;
        currentConversationId = convId;
        saveToLocalStorage();
        renderSidebar();
        renderCurrentChat();
        chatTitleEl.innerText = conv.title;
        messageInput.value = '';
      }
      
      async function clearCurrentChat() {
        if (isWaitingResponse) {
          showAlert('Tunggu', 'AI sedang merespon, mohon tunggu beberapa saat.');
          return;
        }
        const conv = conversations.find(c => c.id === currentConversationId);
        if (!conv) return;
        if (conv.messages.length === 0) {
          showAlert('Info', 'Sesi percakapan ini memang sudah bersih.');
          return;
        }
        const confirmed = await confirmDialog('Bersihkan Pesan', `Hapus seluruh isi riwayat pesan pada sesi "${conv.title}"?`);
        if (confirmed) {
          conv.messages = [];
          saveToLocalStorage();
          renderCurrentChat();
          updateConversationTitle(currentConversationId);
          chatTitleEl.innerText = conv.title;
        }
      }
      
      // SCROLL HELPERS
      async function scrollToBottom() {
        await new Promise(r => setTimeout(r, 40));
        const contentEl = document.querySelector('#chat-content');
        if (contentEl && contentEl.getScrollElement) {
          const scrollEl = await contentEl.getScrollElement();
          if (scrollEl) {
            scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: 'smooth' });
          }
        }
      }
      
      async function scrollToTop() {
        const contentEl = document.querySelector('#chat-content');
        if (contentEl && contentEl.getScrollElement) {
          const scrollEl = await contentEl.getScrollElement();
          if (scrollEl) {
            scrollEl.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }
      }
      
      function initScrollListener() {
        const chatContent = document.querySelector('#chat-content');
        if (!chatContent) return;
        chatContent.addEventListener('ionScroll', (ev) => {
          const scrollTop = ev.detail.scrollTop;
          if (scrollTop > 300) {
            scrollTopFab.style.display = 'flex';
          } else {
            scrollTopFab.style.display = 'none';
          }
        });
      }
      
      // ---------- INITIALIZE APP ----------
      function init() {
        loadFromLocalStorage();
        messagesContainer = document.getElementById('messages-container');
        emptyPlaceholder = document.getElementById('empty-chat-placeholder');
        conversationListEl = document.getElementById('conversation-list');
        messageInput = document.getElementById('message-input');
        sendBtn = document.getElementById('send-message-btn');
        scrollTopFab = document.getElementById('scroll-top-fab');
        chatTitleEl = document.getElementById('chat-title');
        
        renderSidebar();
        renderCurrentChat();
        const curConv = conversations.find(c => c.id === currentConversationId);
        if (curConv) chatTitleEl.innerText = curConv.title;
        
        sendBtn.addEventListener('click', () => sendUserMessage());
        messageInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            sendUserMessage();
          }
        });
        document.getElementById('new-chat-btn')?.addEventListener('click', () => createNewChat());
        document.getElementById('clear-current-chat-btn')?.addEventListener('click', () => clearCurrentChat());
        document.getElementById('scroll-top-btn')?.addEventListener('click', () => scrollToTop());
        
        initScrollListener();
        
        setTimeout(() => {
          scrollToBottom();
        }, 300);
      }
      
      window.addEventListener('DOMContentLoaded', () => {
        init();
      });
    })();
  </script>
</body>
</html>
